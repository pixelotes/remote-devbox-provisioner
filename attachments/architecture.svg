<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .box { rx: 10px; ry: 10px; }
      .client-box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; }
      .host-box { fill: #1e293b; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 4; }
      .vm-box { fill: #0f172a; stroke: #a855f7; stroke-width: 2; }
      .bridge-box { fill: #1e3a5f; stroke: #0284c7; stroke-width: 1.5; }
      .tunnel-line { stroke: #38bdf8; stroke-width: 3; stroke-dasharray: 8 5; fill: none; }
      .bridge-line { stroke: #a855f7; stroke-width: 2; fill: none; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #94a3b8; }
      .text-badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #38bdf8; font-weight: 600; }
      .text-badge-purple { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #c084fc; font-weight: 600; }
      .badge-bg { fill: #0c4a6e; rx: 4px; ry: 4px; }
      .badge-purple-bg { fill: #581c87; rx: 4px; ry: 4px; }
      .tag { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 600; fill: #e2e8f0; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a855f7" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#090d16" rx="12" />

  <!-- Title & Subtitle -->
  <text x="40" y="45" class="text-title" font-size="20">VDI Infrastructure &amp; SSH Jump Architecture</text>
  <text x="40" y="68" class="text-sub">Isolated guest provisioning via LXD internal NAT bridge and SSH ProxyJump</text>

  <!-- ================= CLIENT ZONE ================= -->
  <g transform="translate(40, 110)">
    <rect width="210" height="310" class="box client-box" />
    <circle cx="35" cy="35" r="14" fill="#0284c7" />
    <path d="M 28 35 L 42 35 M 35 28 L 35 42" stroke="#ffffff" stroke-width="2" />
    <text x="60" y="35" class="text-title">Client Machine</text>
    <text x="60" y="52" class="text-sub">Dev / Admin Workstation</text>

    <!-- Client Details -->
    <rect x="20" y="80" width="170" height="50" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="32" y="102" class="tag">Security Context</text>
    <text x="32" y="118" class="text-sub">Trusted IP or Corporate VPN</text>

    <rect x="20" y="145" width="170" height="65" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="32" y="167" class="tag">SSH Authentication</text>
    <text x="32" y="185" class="text-badge">~/.ssh/id_rsa (600)</text>
    <text x="32" y="200" class="text-sub">Same key for host &amp; VM</text>

    <rect x="20" y="225" width="170" height="60" rx="6" fill="#0c4a6e" stroke="#0284c7" />
    <text x="32" y="247" class="tag" fill="#38bdf8">Connection Command</text>
    <text x="32" y="268" class="text-badge" font-size="10">ssh -J user@host_ip</text>
  </g>

  <!-- ================= HOST ZONE ================= -->
  <g transform="translate(310, 110)">
    <rect width="550" height="310" class="box host-box" />
    
    <!-- Host Header -->
    <text x="25" y="34" class="text-title">Remote Linux Host</text>
    <rect x="180" y="20" width="130" height="20" class="badge-bg" />
    <text x="188" y="34" class="text-badge">&lt;host_ip&gt; : 22</text>
    <text x="25" y="52" class="text-sub">Dedicated Server / Bare Metal / Cloud VPS (Ubuntu 22.04 / 24.04)</text>

    <!-- Host SSH Daemon -->
    <g transform="translate(25, 75)">
      <rect width="210" height="95" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
      <text x="16" y="28" class="tag">Host SSH Service</text>
      <text x="16" y="46" class="text-sub">Non-privileged user account</text>
      <rect x="16" y="58" width="90" height="20" rx="4" fill="#334155" />
      <text x="24" y="72" class="text-sub" font-size="11" fill="#cbd5e1">No sudo rights</text>
      <circle cx="185" cy="25" r="5" fill="#22c55e" />
    </g>

    <!-- LXD Internal Bridge (lxdbr0) -->
    <g transform="translate(25, 195)">
      <rect width="210" height="90" rx="8" class="bridge-box" />
      <text x="16" y="26" class="tag" fill="#bae6fd">LXD Bridge (lxdbr0)</text>
      <rect x="16" y="38" width="105" height="18" class="badge-bg" />
      <text x="22" y="51" class="text-badge">10.0.0.1 / 24</text>
      <text x="16" y="74" class="text-sub">Internal NAT Gateway &amp; DHCP</text>
    </g>

    <!-- ================= GUEST VM ZONE ================= -->
    <g transform="translate(270, 75)">
      <rect width="255" height="210" class="box vm-box" />
      
      <!-- VM Header -->
      <text x="18" y="28" class="text-title" fill="#e9d5ff">Guest VM / VDI</text>
      <rect x="18" y="40" width="120" height="20" class="badge-purple-bg" />
      <text x="24" y="54" class="text-badge-purple">10.0.0.100 : 22</text>
      <text x="18" y="78" class="text-sub">Ubuntu 24.04 Cloud Image</text>

      <!-- VM Specs -->
      <rect x="18" y="90" width="219" height="50" rx="6" fill="#1e1b4b" stroke="#6b21a8" />
      <text x="28" y="110" class="tag" fill="#d8b4fe">LXD Profile (S - XXL)</text>
      <text x="28" y="126" class="text-sub">Hardware Limits: CPU, RAM, Disk</text>

      <!-- VM Privileges -->
      <rect x="18" y="148" width="219" height="48" rx="6" fill="#1e1b4b" stroke="#6b21a8" />
      <text x="28" y="168" class="tag" fill="#d8b4fe">User Permissions</text>
      <text x="28" y="184" class="text-sub">Full Sudoer (NOPASSWD:ALL)</text>
    </g>

    <!-- Host internal routing lines -->
    <path d="M 130 170 L 130 195" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />
    <path d="M 235 240 L 270 240" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-purple)" />
  </g>

  <!-- ================= CONNECTION TUNNELS ================= -->
  <!-- Client to Host SSH -->
  <path d="M 250 200 L 330 200" class="tunnel-line" marker-end="url(#arrow-blue)" />
  <rect x="255" y="172" width="70" height="20" rx="4" fill="#0f172a" stroke="#0284c7" />
  <text x="262" y="186" class="text-badge" font-size="10">Port 22</text>

</svg>

