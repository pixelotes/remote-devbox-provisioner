- name: Install LXD and setup Ubuntu 24.04 VM
  become: true
  hosts: localhost
  vars:
    username: "devuser"
    ipv4_address: "10.0.0.100" # Static ip for the vm
    vm_profile: "xxl-vm-profile"
    vm_image: "n" # Alias for Ubuntu 24.04 noble
    vm_repository: "https://cloud-images.ubuntu.com/releases"
    vm_type: "virtual-machine" # virtual-machine or container

  tasks:
  
    # Upgrade all packages in the host
    - name: Upgrade packages
      apt:
        upgrade: yes

    # Create user
    - name: Create user {{ username }} without password
      user:
        name: "{{ username }}"
        password: "!"
        shell: /bin/bash
        generate_ssh_key: yes
        ssh_key_type: rsa
        ssh_key_file: .ssh/id_rsa

    - name: Add {{ username }} public key to authorized_keys
      authorized_key:
        user: "{{ username }}"
        state: present
        key: "{{ lookup('file', '/home/{{ username }}/.ssh/id_rsa.pub') }}"

    # Instal lxd snap
    - name: Install lxd snap
      community.general.snap:
        name: lxd
        state: present

    # Wait for LXD service to be fully available
    - name: Wait for LXD service to be ready
      wait_for:
        path: /var/snap/lxd/common/lxd/unix.socket
        state: present
        timeout: 30

    # Check if LXD is already initialized
    - name: Check if LXD default storage pool exists
      command: lxc storage show default
      register: lxd_storage_check
      failed_when: false
      changed_when: false

    # Initialize LXD
    - name: Initialize LXD with the preseed file
      command: cat preseed.yaml | lxd init --preseed
      when: lxd_storage_check.rc != 0

    # Create a profile for the vm
    - name: Create LXD profile (size s)
      community.general.lxd_profile:
        name: s-vm-profile
        state: present
        config:
          limits.cpu: "1"
          limits.memory: "2GB"
          security.secureboot: "false"
        devices:
          root:
            path: /
            pool: default
            size: 20GB
            type: disk
          eth0:
            name: eth0
            nictype: bridged
            parent: lxdbr0
            type: nic
            
    - name: Create LXD profile (size m)
      community.general.lxd_profile:
        name: m-vm-profile
        state: present
        config:
          limits.cpu: "2"
          limits.memory: "4GB"
          security.secureboot: "false"
        devices:
          root:
            path: /
            pool: default
            size: 40GB
            type: disk
          eth0:
            name: eth0
            nictype: bridged
            parent: lxdbr0
            type: nic

    - name: Create LXD profile (size l)
      community.general.lxd_profile:
        name: l-vm-profile
        state: present
        config:
          limits.cpu: "4"
          limits.memory: "8GB"
          security.secureboot: "false"
        devices:
          root:
            path: /
            pool: default
            size: 60GB
            type: disk
          eth0:
            name: eth0
            nictype: bridged
            parent: lxdbr0
            type: nic

    - name: Create LXD profile (size xl)
      community.general.lxd_profile:
        name: xl-vm-profile
        state: present
        config:
          limits.cpu: "4"
          limits.memory: "16GB"
          security.secureboot: "false"
        devices:
          root:
            path: /
            pool: default
            size: 80GB
            type: disk
          eth0:
            name: eth0
            nictype: bridged
            parent: lxdbr0
            type: nic

    - name: Create LXD profile (size xxl)
      community.general.lxd_profile:
        name: xxl-vm-profile
        state: present
        config:
          limits.cpu: "16"
          limits.memory: "64GB"
          security.secureboot: "false"
        devices:
          root:
            path: /
            pool: default
            size: 6TB
            type: disk
          eth0:
            name: eth0
            nictype: bridged
            parent: lxdbr0
            type: nic

    # Create a VM with Ubuntu 24.04 (Noble Numbat)
    - name: Create Ubuntu 24.04 VM
      community.general.lxd_container:
        name: "{{ username }}-vm"
        type: "{{ vm_type }}"
        state: stopped
        source:
          type: image
          mode: pull
          server: "{{ vm_repository }}"
          protocol: simplestreams
          alias: "{{ vm_image }}"
        profiles:
          - "{{ vm_profile }}"

    - name: Creating an inventory file for ansible
      copy:
        dest: "./hosts.yaml"
        content: |
          all:
            vars:
              ansible_connection: lxd
              ansible_user: root
              ansible_become: no
              target_username: "{{ username }}"
            children:
              local:
                vars:
                  ansible_lxd_remote: local
                  ansible_lxd_project: default
                hosts:
                  {{ username }}-vm:

    # LXC won't let me change the dynamic ip when using profiles
    # unless I attach a new nic, overriding the old one
    
    # Check if eth0 device is already attached
    - name: Check VM devices
      command: lxc config device show {{ username }}-vm
      register: vm_devices
      failed_when: false
      changed_when: false

    # Override network settings
    - name: Override eth0
      command: lxc network attach lxdbr0 {{ username }}-vm eth0 eth0
      when: "'eth0' not in vm_devices.stdout"
      ignore_errors: yes

    - name: Set up ip address
      command: lxc config device set {{ username }}-vm eth0 ipv4.address {{ ipv4_address }}

    # Boot vm
    - name: start vm
      command: lxc start {{ username }}-vm

    # Wait for vm to be initialized
    - name: wait 60 seconds for the vm to boot
      pause:
        seconds: 60

    # Once the vm is running, copy {{ username }} pub key to vm
    - name: Copy {{ username }} public key to VM
      command: lxc file push /home/{{ username }}/.ssh/id_rsa.pub {{ username }}-vm/root/
      ignore_errors: yes